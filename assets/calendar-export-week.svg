  <rect x="364" y="260" width="3" height="196" fill="#30d158"/>
  <text x="371" y="275" font-size="8.5" font-weight="700" fill="#aef0c0">[liam] Rec Daytime LG</text>
  <text x="371" y="287" font-size="8" fill="#7fce97">Louisville Rec &amp; Senior…</text>
  <text x="371" y="299" font-size="8" fill="#7fce97">10 AM – 5 PM</text>

  <!-- Thu 15 (col left 460) : Rec Daytime 10AM-4PM -->
  <rect x="464" y="260" width="92" height="168" rx="4" fill="#1e3a26"/>
  <rect x="464" y="260" width="3" height="168" fill="#30d158"/>
  <text x="471" y="275" font-size="8.5" font-weight="700" fill="#aef0c0">[liam] Rec Daytime LG</text>
  <text x="471" y="287" font-size="8" fill="#7fce97">Louisville Rec &amp; Senior…</text>
  <text x="471" y="299" font-size="8" fill="#7fce97">10 AM – 4 PM</text>

  <!-- Fri 16 (col left 560) : Rec Daytime 5:15-11AM -->
  <rect x="564" y="127" width="92" height="161" rx="4" fill="#1e3a26"/>
  <rect x="564" y="127" width="3" height="161" fill="#30d158"/>
  <text x="571" y="142" font-size="8.5" font-weight="700" fill="#aef0c0">[liam] Rec Daytime LG</text>
  <text x="571" y="154" font-size="8" fill="#7fce97">Louisville Rec &amp; Senior…</text>
  <text x="571" y="166" font-size="8" fill="#7fce97">5:15 – 11 AM</text>

  <!-- Sat 17 (col left 660) -->
  <rect x="664" y="232" width="92" height="28" rx="4" fill="#2a2550"/>
  <rect x="664" y="232" width="3" height="28" fill="#5e5ce6"/>
  <text x="671" y="243" font-size="8.5" font-weight="700" fill="#cfccff">[tracy] NIA Hybrid</text>
  <text x="671" y="254" font-size="8" fill="#a5a0e0">9 – 10 AM</text>

  <rect x="664" y="274" width="92" height="28" rx="4" fill="#2a2550"/>
  <rect x="664" y="274" width="3" height="28" fill="#5e5ce6"/>
  <text x="671" y="285" font-size="8.5" font-weight="700" fill="#cfccff">[tracy] Cardio Drumming</text>
  <text x="671" y="296" font-size="8" fill="#a5a0e0">10:30 – 11:30 AM</text>

  <!-- footer tag -->
  <rect x="40" y="504" width="210" height="22" rx="11" fill="#13351d"/>
  <text x="145" y="519" font-size="11" font-weight="700" fill="#30d158" text-anchor="middle">synced hourly · travel time added</text>
</svg>
