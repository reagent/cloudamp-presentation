<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloudamp — Connect account</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ff8a1f}a:hover{color:#ffb066}
</style>
</helmet>
<div style="width: 640px; height: 420px; box-sizing: border-box; padding: 40px 45px; background: #1b1d23; display: flex; justify-content: center; align-items: flex-start; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #c9ccd6">
<div style="width: 550px; background: #2b2d35; border: 2px solid; border-color: #4f5360 #121318 #121318 #4f5360; box-sizing: border-box">
<div style="height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: repeating-linear-gradient(0deg, #34363f 0 2px, #2b2d35 2px 4px); border-bottom: 1px solid #121318">
<div style="display: flex; gap: 6px">
<div style="width: 10px; height: 10px; background: #e0533c; border: 1px solid #121318"></div>
<div style="width: 10px; height: 10px; background: #e2a33a; border: 1px solid #121318"></div>
<div style="width: 10px; height: 10px; background: #5aa84a; border: 1px solid #121318"></div>
</div>
<div style="flex-grow: 1; text-align: center; font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 3px; color: #aeb2bf">CLOUDAMP SETUP</div>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="background: #0c0805; border: 2px solid; border-color: #121318 #5a5e6b #5a5e6b #121318; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'VT323', monospace; font-size: 34px; line-height: 32px; color: #ff8a1f">NOT CONNECTED</div>
<div style="font-family: 'VT323', monospace; font-size: 20px; color: #8a6a44">LINK A SOUNDCLOUD ACCOUNT TO LOAD YOUR STREAM + LIKES</div>
</div>
<div style="font-size: 12px; line-height: 18px; color: #aeb2bf">Opens SoundCloud sign-in in your browser. Cloudamp only asks to read your stream and likes, and to like tracks on your behalf.</div>
<div style="display: flex; gap: 8px">
<button style="flex-grow: 1; height: 44px; background: #3a3d47; border: 2px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 1px; color: #ff8a1f; cursor: pointer">CONNECT SOUNDCLOUD</button>
<button style="height: 44px; padding: 0 16px; background: #2b2d35; border: 2px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 10px; color: #aeb2bf; cursor: pointer">SEARCH ONLY</button>
</div>
<div style="display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 8px; color: #7d8190">
<div>OAUTH 2.1 · PKCE</div>
<div>TOKEN STORED IN KEYCHAIN</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":420}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
