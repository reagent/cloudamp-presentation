<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloudamp — Player and Browser</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=VT323&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ff8a1f}a:hover{color:#ffb066}
.cb-btn{cursor:pointer}
.cb-btn:hover{filter:brightness(1.25)}
.cb-btn:active{border-color:#121318 #5a5e6b #5a5e6b #121318 !important}
.cb-row{cursor:pointer}
.cb-row:hover{background:#1d2a1a}
.cb-tab{cursor:pointer}
.cb-search::placeholder{color:#6b5a44}
</style>
</helmet>
<div style="width: 640px; height: 860px; box-sizing: border-box; padding: 40px 45px; background: #1b1d23; display: flex; flex-direction: column; align-items: center; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #c9ccd6">

<!-- MAIN PLAYER WINDOW -->
<div style="width: 550px; background: #2b2d35; border: 2px solid; border-color: #4f5360 #121318 #121318 #4f5360; box-sizing: border-box; display: flex; flex-direction: column">
<!-- title bar -->
<div style="height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: repeating-linear-gradient(0deg, #34363f 0 2px, #2b2d35 2px 4px); border-bottom: 1px solid #121318">
<div style="display: flex; gap: 6px">
<div style="width: 10px; height: 10px; background: #e0533c; border: 1px solid #121318"></div>
<div style="width: 10px; height: 10px; background: #e2a33a; border: 1px solid #121318"></div>
<div style="width: 10px; height: 10px; background: #5aa84a; border: 1px solid #121318"></div>
</div>
<div style="flex-grow: 1; text-align: center; font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 3px; color: #aeb2bf">CLOUDAMP</div>
<div style="font-family: 'Silkscreen', monospace; font-size: 9px; color: #7d8190">v0.1</div>
</div>

<!-- display area -->
<div style="display: flex; gap: 10px; padding: 12px 12px 8px">
<!-- LCD -->
<div style="width: 190px; height: 112px; background: #0c0805; border: 2px solid; border-color: #121318 #5a5e6b #5a5e6b #121318; box-sizing: border-box; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<div style="font-family: 'Silkscreen', monospace; font-size: 10px; color: {{lcd}}; width: 14px">{{stateGlyph}}</div>
<div style="font-family: 'VT323', monospace; font-size: 50px; line-height: 40px; color: {{lcd}}; letter-spacing: 2px">{{elapsedLabel}}</div>
</div>
<div style="display: flex; align-items: flex-end; gap: 2px; height: 34px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="19">
<div style="width: 7px; height: {{b.h}}px; background: {{lcd}}; opacity: {{b.o}}"></div>
</sc-for>
</div>
</div>

<!-- right column -->
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
<div style="height: 26px; background: #0c0805; border: 2px solid; border-color: #121318 #5a5e6b #5a5e6b #121318; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; overflow: hidden">
<div style="font-family: 'VT323', monospace; font-size: 20px; color: {{lcd}}; white-space: nowrap">{{marquee}}</div>
</div>
<div style="display: flex; gap: 6px; align-items: center; font-family: 'Silkscreen', monospace; font-size: 9px">
<div style="background: #0c0805; color: {{lcd}}; padding: 3px 6px; border: 1px solid #3a3d47">128</div>
<div style="color: #7d8190">KBPS</div>
<div style="background: #0c0805; color: {{lcd}}; padding: 3px 6px; border: 1px solid #3a3d47">44</div>
<div style="color: #7d8190">KHZ</div>
<div style="flex-grow: 1"></div>
<div style="color: {{lcd}}">STREAM</div>
<div style="color: #4a4d58">HQ</div>
</div>
<!-- volume / pan -->
<div style="display: flex; gap: 10px; align-items: center">
<label style="font-family: 'Silkscreen', monospace; font-size: 9px; color: #7d8190">VOL</label>
<div style="flex-grow: 1; height: 8px; background: #121318; border: 1px solid #3a3d47; position: relative">
<div style="width: 72%; height: 100%; background: #6b4a24"></div>
<div style="position: absolute; left: 68%; top: -5px; width: 12px; height: 16px; background: #8c909d; border: 1px solid; border-color: #c7cad3 #2a2c33 #2a2c33 #c7cad3; box-sizing: border-box"></div>
</div>
<label style="font-family: 'Silkscreen', monospace; font-size: 9px; color: #7d8190">PAN</label>
<div style="width: 60px; height: 8px; background: #121318; border: 1px solid #3a3d47; position: relative">
<div style="position: absolute; left: 24px; top: -5px; width: 12px; height: 16px; background: #8c909d; border: 1px solid; border-color: #c7cad3 #2a2c33 #2a2c33 #c7cad3; box-sizing: border-box"></div>
</div>
</div>
<div style="display: flex; gap: 6px">
<button class="cb-btn" onClick="{{toggleLike}}" style="height: 22px; padding: 0 8px; background: #2b2d35; border: 1px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 9px; color: {{likeColor}}">{{likeLabel}}</button>
<button class="cb-btn" onClick="{{toggleShuffle}}" style="height: 22px; padding: 0 8px; background: #2b2d35; border: 1px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 9px; color: {{shuffleColor}}">SHUF</button>
<button class="cb-btn" onClick="{{toggleRepeat}}" style="height: 22px; padding: 0 8px; background: #2b2d35; border: 1px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 9px; color: {{repeatColor}}">REP</button>
<div style="flex-grow: 1"></div>
<div style="font-family: 'Silkscreen', monospace; font-size: 9px; color: #7d8190; align-self: center">{{plays}} PLAYS</div>
</div>
</div>
</div>

<!-- seek / waveform -->
<div style="padding: 0 12px 10px">
<div style="height: 22px; background: #0c0805; border: 2px solid; border-color: #121318 #5a5e6b #5a5e6b #121318; box-sizing: border-box; display: flex; align-items: center; gap: 1px; padding: 0 3px; position: relative">
<sc-for list="{{wave}}" as="w" hint-placeholder-count="104">
<div style="width: 4px; height: {{w.h}}px; background: {{w.c}}"></div>
</sc-for>
</div>
</div>

<!-- transport -->
<div style="display: flex; gap: 4px; padding: 0 12px 12px; align-items: center">
<button class="cb-btn" onClick="{{prev}}" aria-label="Previous track" style="width: 46px; height: 36px; background: #3a3d47; border: 2px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; display: flex; align-items: center; justify-content: center; color: #d6d9e2">
<svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 1v12M16 1L6 7l10 6z"></path></svg>
</button>
<button class="cb-btn" onClick="{{play}}" aria-label="Play" style="width: 46px; height: 36px; background: #3a3d47; border: 2px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; display: flex; align-items: center; justify-content: center; color: {{playColor}}">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 1l10 6-10 6z"></path></svg>
</button>
<button class="cb-btn" onClick="{{pause}}" aria-label="Pause" style="width: 46px; height: 36px; background: #3a3d47; border: 2px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; display: flex; align-items: center; justify-content: center; color: {{pauseColor}}">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 1v12M10 1v12"></path></svg>
</button>
<button class="cb-btn" onClick="{{stop}}" aria-label="Stop" style="width: 46px; height: 36px; background: #3a3d47; border: 2px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; display: flex; align-items: center; justify-content: center; color: #d6d9e2">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="10" height="10"></rect></svg>
</button>
<button class="cb-btn" onClick="{{next}}" aria-label="Next track" style="width: 46px; height: 36px; background: #3a3d47; border: 2px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; display: flex; align-items: center; justify-content: center; color: #d6d9e2">
<svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 1v12M2 1l10 6-10 6z"></path></svg>
</button>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<div style="font-family: 'Silkscreen', monospace; font-size: 13px; letter-spacing: 2px; color: {{lcd}}">CLOUDAMP</div>
<div style="font-family: 'Silkscreen', monospace; font-size: 8px; color: #7d8190">POWERED BY SOUNDCLOUD API</div>
</div>
</div>
</div>

<!-- BROWSER / PLAYLIST WINDOW -->
<div style="width: 550px; background: #2b2d35; border: 2px solid; border-color: #4f5360 #121318 #121318 #4f5360; border-top: none; box-sizing: border-box; display: flex; flex-direction: column">
<div style="height: 24px; display: flex; align-items: center; padding: 0 8px; background: repeating-linear-gradient(0deg, #34363f 0 2px, #2b2d35 2px 4px); border-bottom: 1px solid #121318; border-top: 1px solid #4f5360">
<div style="flex-grow: 1; text-align: center; font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 3px; color: #aeb2bf">BROWSER</div>
</div>

<div style="padding: 8px 10px 0; display: flex; gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button class="cb-btn cb-tab" onClick="{{t.pick}}" style="height: 28px; padding: 0 14px; background: {{t.bg}}; border: 1px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 10px; color: {{t.fg}}">{{t.label}}</button>
</sc-for>
<div style="flex-grow: 1"></div>
<div style="align-self: center; font-family: 'Silkscreen', monospace; font-size: 9px; color: #7d8190">@[YOUR_USERNAME]</div>
</div>

<div style="padding: 8px 10px; display: flex; gap: 6px">
<label for="cb-q" style="display: none">Search tracks</label>
<input id="cb-q" class="cb-search" placeholder="search soundcloud…" value="{{query}}" onChange="{{onQuery}}" style="flex-grow: 1; height: 28px; box-sizing: border-box; background: #0c0805; border: 2px solid; border-color: #121318 #5a5e6b #5a5e6b #121318; color: {{lcd}}; font-family: 'VT323', monospace; font-size: 18px; padding: 0 8px; outline: none">
<button class="cb-btn" style="height: 28px; padding: 0 12px; background: #3a3d47; border: 1px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 9px; color: #d6d9e2">GO</button>
</div>

<div style="margin: 0 10px; height: 330px; overflow: auto; background: #050605; border: 2px solid; border-color: #121318 #5a5e6b #5a5e6b #121318">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div class="cb-row" onClick="{{r.pick}}" style="height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: {{r.bg}}; font-size: 13px; color: {{r.fg}}">
<div style="width: 22px; text-align: right; color: {{r.numFg}}">{{r.num}}.</div>
<div style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.artist}} — {{r.title}}</div>
<div style="font-size: 12px; color: {{r.numFg}}">{{r.dur}}</div>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 24px; font-family: 'VT323', monospace; font-size: 20px; color: #6b5a44; text-align: center">NO TRACKS MATCH</div>
</sc-if>
</div>

<div style="display: flex; gap: 4px; align-items: center; padding: 8px 10px 10px">
<button class="cb-btn" style="height: 26px; padding: 0 10px; background: #3a3d47; border: 1px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 9px; color: #d6d9e2">+ QUEUE</button>
<button class="cb-btn" style="height: 26px; padding: 0 10px; background: #3a3d47; border: 1px solid; border-color: #5a5e6b #121318 #121318 #5a5e6b; font-family: 'Silkscreen', monospace; font-size: 9px; color: #d6d9e2">SORT</button>
<div style="flex-grow: 1"></div>
<div style="background: #0c0805; border: 1px solid #3a3d47; padding: 5px 8px; font-family: 'VT323', monospace; font-size: 16px; color: {{lcd}}">{{footer}}</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lcd":{"editor":"color","default":"#ff8a1f","options":["#ff8a1f","#4dff7a","#5ad1ff","#f2f2f2"]},"$preview":{"width":640,"height":860}}'>
const TRACKS = [
  { id: 1, artist: 'Halden Rue', title: 'Low Tide Static', d: 252, plays: '48.2K', liked: true },
  { id: 2, artist: 'MOTHWAVE', title: 'Neon Pilgrim', d: 227, plays: '312K', liked: false },
  { id: 3, artist: 'Kesi Arlo', title: 'Paper Satellites', d: 303, plays: '9,871', liked: true },
  { id: 4, artist: 'dj quietroom', title: '3am cassette edit', d: 381, plays: '1.1M', liked: false },
  { id: 5, artist: 'The Velvet Hours', title: 'Overpass', d: 209, plays: '22.5K', liked: false },
  { id: 6, artist: 'Saoirse Lumen', title: 'Glass Orchard (demo)', d: 178, plays: '3,402', liked: true },
  { id: 7, artist: 'Bramble & Coil', title: 'Drift Theory', d: 280, plays: '67.0K', liked: false },
  { id: 8, artist: 'nightbus', title: 'sodium lights', d: 195, plays: '140K', liked: true },
  { id: 9, artist: 'Ofelia Marsh', title: 'Second Hand Sun', d: 245, plays: '18.9K', liked: false },
  { id: 10, artist: 'KAIROS UNIT', title: 'Tessellate', d: 432, plays: '5,550', liked: false },
  { id: 11, artist: 'Pale Harbor', title: 'Lantern Season', d: 266, plays: '73.4K', liked: true },
  { id: 12, artist: 'wren & the static', title: 'Atlas (live)', d: 318, plays: '11.2K', liked: false }
];
function fmt(s) { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60); const r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
const WAVE = Array.from({ length: 104 }, (_, i) => 4 + Math.round(Math.abs(Math.sin(i * 0.37) * 7 + Math.sin(i * 1.3) * 4)));

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { cur: 0, playing: true, elapsed: 102, tab: 'stream', query: '', liked: {}, shuffle: false, repeat: true, seed: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (!this.state.playing) return;
      const t = TRACKS[this.state.cur];
      let e = this.state.elapsed + 0.5;
      if (e >= t.d) { this.go(1); return; }
      this.setState({ elapsed: e, seed: this.state.seed + 1 });
    }, 500);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  isLiked(t) { const v = this.state.liked[t.id]; return v === undefined ? t.liked : v; }
  list() {
    const q = this.state.query.trim().toLowerCase();
    let xs = TRACKS.map((t, i) => ({ t, i }));
    if (this.state.tab === 'likes') xs = xs.filter((x) => this.isLiked(x.t));
    if (q) xs = xs.filter((x) => (x.t.artist + ' ' + x.t.title).toLowerCase().includes(q));
    return xs;
  }
  go(dir) {
    let n;
    if (this.state.shuffle) n = Math.floor(Math.random() * TRACKS.length);
    else n = (this.state.cur + dir + TRACKS.length) % TRACKS.length;
    this.setState({ cur: n, elapsed: 0, playing: true });
  }
  renderVals() {
    const lcd = this.props.lcd ?? '#ff8a1f';
    const s = this.state;
    const t = TRACKS[s.cur];
    const seed = s.seed;
    const bars = Array.from({ length: 19 }, (_, i) => {
      const h = s.playing ? 4 + Math.round(Math.abs(Math.sin(seed * 0.9 + i * 0.7) * Math.cos(seed * 0.31 + i * 0.23)) * 28) : 2;
      return { h, o: 0.35 + (h / 34) * 0.65 };
    });
    const prog = s.elapsed / t.d;
    const wave = WAVE.map((h, i) => ({ h, c: i / WAVE.length <= prog ? lcd : '#3b2a18' }));
    const liked = this.isLiked(t);
    const xs = this.list();
    const totalSec = xs.reduce((a, x) => a + x.t.d, 0);
    const rows = xs.map((x, k) => {
      const playingRow = x.i === s.cur;
      return {
        num: k + 1, artist: x.t.artist, title: x.t.title, dur: fmt(x.t.d),
        bg: playingRow ? '#2a1a0c' : 'transparent',
        fg: playingRow ? '#ffffff' : lcd,
        numFg: playingRow ? lcd : '#8a6a44',
        pick: () => this.setState({ cur: x.i, elapsed: 0, playing: true })
      };
    });
    const tabs = [['stream', 'STREAM'], ['likes', 'LIKES'], ['search', 'SEARCH']].map(([id, label]) => ({
      label, bg: s.tab === id ? '#0c0805' : '#3a3d47', fg: s.tab === id ? lcd : '#aeb2bf',
      pick: () => this.setState({ tab: id })
    }));
    return {
      lcd,
      stateGlyph: s.playing ? '▶' : (s.elapsed > 0 ? 'II' : '■'),
      elapsedLabel: fmt(s.elapsed),
      marquee: (s.cur + 1) + '. ' + t.artist.toUpperCase() + ' — ' + t.title.toUpperCase() + ' (' + fmt(t.d) + ')',
      plays: t.plays,
      bars, wave, rows, tabs,
      empty: rows.length === 0,
      query: s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      footer: rows.length + ' TRACKS / ' + fmt(totalSec),
      likeLabel: liked ? '♥ LIKED' : '♡ LIKE',
      likeColor: liked ? lcd : '#aeb2bf',
      shuffleColor: s.shuffle ? lcd : '#7d8190',
      repeatColor: s.repeat ? lcd : '#7d8190',
      playColor: s.playing ? lcd : '#d6d9e2',
      pauseColor: !s.playing && s.elapsed > 0 ? lcd : '#d6d9e2',
      toggleLike: () => this.setState({ liked: { ...s.liked, [t.id]: !liked } }),
      toggleShuffle: () => this.setState({ shuffle: !s.shuffle }),
      toggleRepeat: () => this.setState({ repeat: !s.repeat }),
      play: () => this.setState({ playing: true }),
      pause: () => this.setState({ playing: false }),
      stop: () => this.setState({ playing: false, elapsed: 0 }),
      prev: () => this.go(-1),
      next: () => this.go(1)
    };
  }
}
</script>
</body>
</html>
