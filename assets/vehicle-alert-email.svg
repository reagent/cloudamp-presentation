  <circle cx="60" cy="39" r="6" fill="#febc2e"/>
  <circle cx="80" cy="39" r="6" fill="#28c840"/>
  <line x1="16" y1="62" x2="624" y2="62" stroke="#e4e4e7" stroke-width="1"/>

